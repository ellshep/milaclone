# no-mistakes gate config (https://kunchenguid.github.io/no-mistakes/reference/repo-config/).
# Commands here are read from main only. CI stays the full regression run.
commands:
  prepare: 'npm ci --prefer-offline'
  test: 'npm test && npm run test:ui'
  lint: 'npm run lint && npm run format:check && npm run check:docs'
  format: 'npm run format'
review:
  max_fix_rounds: 3
  path_instructions:
    - path: 'db.js'
      instructions: |
        Ordinary item and canvas reads filter `trashedBy IS NULL`. Deleting an item tags it and its subtree. Trash queries can read tagged rows, restore clears the tags, and emptying Trash permanently deletes tagged rows and unlinks uploads only when no surviving item references them. Keep routes calling the prepared statements directly. `items.data` is a JSON string in SQLite and an object at the API boundary.
    - path: 'routes.js'
      instructions: |
        A `board` item owns a child canvas. Its title, color and icon live on the child canvas row and come back as `_childTitle`/`_childColor`/`_childIcon`. Ordinary item and canvas reads filter `trashedBy IS NULL`. Item deletion moves the subtree to Trash. Trash routes list and restore trashed items, and `DELETE /api/trash` permanently purges them. Restore returns 409 when the item's board is still trashed. Board UI routes are unauthenticated on purpose (the tailnet is trusted). Only the task API uses the bearer token.
    - path: 'tasklist.js'
      instructions: |
        This module defines what a task is. Tasks stay entries in todo cards' `data.tasks`; do not propose a tasks table. Server code that touches tasks goes through this module, and a field a client reads needs a default in both normTask functions: the server one in tasklist.js and the Quick notes one in public/js/quicknotes.js.
    - path: 'focus.js'
      instructions: |
        The one ranking of open tasks, shared by the board route and the token route. Do not propose a second ordering elsewhere.
    - path: 'addons/**'
      instructions: |
        Add-ons are optional and off by default. Core code never imports from addons/, and add-ons reach the board only through its public HTTP APIs. Each add-on's README must state what it sends to third parties. Personal setup details stay out of the repo.
    - path: 'public/js/**'
      instructions: |
        Vanilla ES modules, no framework. Modules that import `main.js` are tested in Playwright, not Vitest. Every edit auto-saves with a PATCH; todo `tasks` writes must send `baseTasks` for the three-way merge. Quick notes normalises tasks itself in quicknotes.js normTask; a new task field needs a default there too.
    - path: '*.md'
      instructions: |
        Prose changes only; do not request test coverage. CLAUDE.md files have word caps checked by `npm run check:docs`, so do not ask for additions there unless not knowing the fact would cause a bug. Working logs and status notes do not belong in the repo.
auto_fix:
  review: 1
pr:
  appendix: collapsed
  intent:
    format: brief
commit:
  trailers:
    - 'Assisted-by: no-mistakes:{{.Agent}}:{{.Model}}'
protected_paths:
  - 'scripts/autodeploy.sh'
  - 'scripts/deploy.sh'
  - 'Dockerfile/**'
  - 'docker-compose.yml'
  - '.github/**'
test:
  instructions: |
    From the repo root, choose an unused TCP port above 4400 and set `port` to that number. First run `d=$(mktemp -d "$PWD/.no-mistakes-app.XXXXXX") || exit 1`, then start the app in the same shell with `DATA_DIR="$d" HOST=127.0.0.1 PORT="$port" node server.js &` and record its PID immediately with `pid=$!`. Confirm that PID owns the listener on `127.0.0.1:$port` before using `GET /api/health` as the readiness check. Use `http://127.0.0.1:$port` as the base URL for every manual check. A fresh `DATA_DIR` gives SQLite an empty board with one Home canvas.
    The board UI is at `/` (Home canvas, with Quick notes inside it) and Focus is at `/focus`. To export Home as Markdown, read `rootCanvasId` from `GET /api/root` and pass it as `:id` in `GET /api/canvas/:id/export.md`. The task API (`docs/task-api.md`) needs `TASK_API_TOKEN` set in the server's environment and a matching bearer token.
    Do not run Playwright (`npm run test:e2e`) locally: it starts three browsers and CI runs the full suite on every PR. Drive browser scenarios by hand against the running server instead.

# no-mistakes gate config (https://kunchenguid.github.io/no-mistakes/reference/repo-config/).
# Commands here are read from main only. CI stays the full regression run.
commands:
  prepare: 'npm ci --prefer-offline'
  test: 'npm test && npm run test:ui'
  lint: 'npm run lint && npm run format:check && npm run check:docs'
  format: 'npm run format'
review:
  max_fix_rounds: 3
  path_instructions:
    - path: 'db.js'
      instructions: |
        Deleting never removes rows: every new query must filter `trashedBy IS NULL`. Routes call the prepared statements directly; there is no repository layer to add. `items.data` is a JSON string in SQLite and an object at the API boundary.
    - path: 'routes.js'
      instructions: |
        A `board` item owns a child canvas; its title, color and icon live on the child canvas row and come back as `_childTitle`/`_childColor`/`_childIcon`. Every query must filter `trashedBy IS NULL`. Board UI routes are unauthenticated on purpose (the tailnet is trusted); only the task API uses the bearer token.
    - path: 'tasklist.js'
      instructions: |
        This module defines what a task is. Tasks stay entries in todo cards' `data.tasks`; do not propose a tasks table. Server code that touches tasks goes through this module, and a field a client reads needs a default in `normTask`.
    - path: 'focus.js'
      instructions: |
        The one ranking of open tasks, shared by the board route and the token route. Do not propose a second ordering elsewhere.
    - path: 'addons/**'
      instructions: |
        Add-ons are optional and off by default. Core code never imports from addons/, and add-ons reach the board only through its public HTTP APIs. Each add-on's README must state what it sends to third parties. Personal setup details stay out of the repo.
    - path: 'public/js/**'
      instructions: |
        Vanilla ES modules, no framework. Modules that import `main.js` are tested in Playwright, not Vitest. Every edit auto-saves with a PATCH; todo `tasks` writes must send `baseTasks` for the three-way merge.
    - path: '**/*.md'
      instructions: |
        Prose changes only; do not request test coverage. CLAUDE.md files have word caps checked by `npm run check:docs`, so do not ask for additions there unless not knowing the fact would cause a bug. Working logs and status notes do not belong in the repo.
auto_fix:
  review: 1
ci:
  rerun_transient: 1
pr:
  appendix: collapsed
  intent:
    format: brief
commit:
  trailers:
    - 'Assisted-by: no-mistakes:{{.Agent}}:{{.Model}}'
protected_paths:
  - 'scripts/autodeploy.sh'
  - 'scripts/deploy.sh'
  - 'Dockerfile'
  - 'docker-compose.yml'
  - '.github/**'
test:
  instructions: |
    Start the app with `DATA_DIR=$(mktemp -d) PORT=4323 node server.js` from the repo root after `npm ci`; it is ready when GET http://127.0.0.1:4323/api/health answers. The board UI is at / (Home canvas, with Quick notes inside it), Focus at /focus, and the Markdown export at /api/export.md. The task API (docs/task-api.md) needs TASK_API_TOKEN set in the server's environment and a matching bearer token. SQLite data lives under DATA_DIR, so a fresh DATA_DIR is an empty board with one Home canvas. Playwright e2e (`npm run test:e2e`) starts its own server on port 4322 and needs browsers installed; run it only when the change touches public/.

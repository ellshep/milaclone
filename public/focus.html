<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus</title>
    <meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151922" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,800&display=swap"
    />
    <link rel="stylesheet" href="/focus.css" />
  </head>
  <body data-mode="three">
    <nav class="controls" aria-label="Focus page">
      <a href="#" data-mode-link="three">Three</a>
      <a href="#list" data-mode-link="list">List</a>
      <button id="refresh" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </nav>
    <main>
      <ol id="three" class="three" aria-label="Focus three" aria-live="polite"></ol>
      <ol id="list" class="list" aria-label="Every ranked task" hidden></ol>
      <p id="empty" class="empty" hidden></p>
      <button id="reset" class="reset" type="button" hidden>Reset order</button>
    </main>
    <script type="module" src="/js/focuspage.js"></script>
  </body>
</html>
